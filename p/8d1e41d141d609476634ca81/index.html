<!DOCTYPE html>
<html lang="en">
<head><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data: blob:; media-src data: blob:; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src data: https://fonts.gstatic.com; script-src 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://unpkg.com; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beach Day Checklist</title>
  <style>
    :root {
      --bg: #f7f7f5;
      --card: #ffffff;
      --text: #1c1c1e;
      --muted: #6e6e73;
      --border: #e5e5ea;
      --accent: #007aff;
      --done-bg: #f0f4f8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121214;
        --card: #1c1c1e;
        --text: #f2f2f7;
        --muted: #98989d;
        --border: #2c2c2e;
        --accent: #0a84ff;
        --done-bg: #1a2430;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px 16px 40px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.4;
    }
    .wrap {
      max-width: 480px;
      margin: 0 auto;
    }
    h1 {
      font-size: 1.5rem;
      margin: 0 0 4px;
    }
    .sub {
      color: var(--muted);
      font-size: 0.95rem;
      margin: 0 0 18px;
    }
    .list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .item {
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 52px;
      padding: 12px 14px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s ease, opacity 0.15s ease;
    }
    .item.done {
      background: var(--done-bg);
      opacity: 0.72;
    }
    .item.done .label {
      text-decoration: line-through;
      color: var(--muted);
    }
    input[type="checkbox"] {
      width: 24px;
      height: 24px;
      accent-color: var(--accent);
      flex-shrink: 0;
      cursor: pointer;
    }
    .label {
      font-size: 1.05rem;
      font-weight: 500;
    }
    .reset {
      margin-top: 18px;
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Beach Day</h1>
    <p class="sub" id="count">0 of 6 packed</p>
    <div class="list" id="list">
      <label class="item"><input type="checkbox" /><span class="label">Towel</span></label>
      <label class="item"><input type="checkbox" /><span class="label">Sunscreen</span></label>
      <label class="item"><input type="checkbox" /><span class="label">Sunglasses &amp; hat</span></label>
      <label class="item"><input type="checkbox" /><span class="label">Water bottle</span></label>
      <label class="item"><input type="checkbox" /><span class="label">Swimsuit &amp; flip-flops</span></label>
      <label class="item"><input type="checkbox" /><span class="label">Phone &amp; dry bag</span></label>
    </div>
    <button class="reset" type="button" id="reset">Reset all</button>
  </div>
  <script>
    const items = Array.from(document.querySelectorAll('.item'));
    const count = document.getElementById('count');
    function update() {
      let done = 0;
      items.forEach(el => {
        const cb = el.querySelector('input');
        el.classList.toggle('done', cb.checked);
        if (cb.checked) done++;
      });
      count.textContent = `${done} of ${items.length} packed`;
    }
    items.forEach(el => {
      el.querySelector('input').addEventListener('change', update);
    });
    document.getElementById('reset').addEventListener('click', () => {
      items.forEach(el => { el.querySelector('input').checked = false; });
      update();
    });
  </script>
</body>
</html>

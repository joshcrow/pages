<!DOCTYPE html>
<html lang="en">
<head><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data: blob:; media-src data: blob:; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src data: https://fonts.gstatic.com; script-src 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://unpkg.com; connect-src 'none'; base-uri 'none'; form-action 'none'">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Pizza Boat Run</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#06283d;--ink:#eaf7ff;--accent:#ffd23f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Press Start 2P',monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100%;padding:10px;gap:10px;background-image:radial-gradient(circle at 50% 0%,#0b3a5c 0,transparent 55%);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
h1{font-size:13px;margin:0;color:var(--accent);letter-spacing:1px;text-shadow:2px 2px 0 #000}
.sub{font-size:8px;color:#7fd4c8;text-align:center;margin-top:3px}
#wrap{position:relative;width:min(94vw,380px)}
canvas{display:block;width:100%;height:auto;image-rendering:pixelated;border:4px solid #000;border-radius:10px;box-shadow:0 0 0 3px #1d5a7a,0 10px 0 #000,0 0 40px rgba(46,196,182,.25);touch-action:none;cursor:pointer}
.hint{font-size:8px;color:#7fd4c8;text-align:center;line-height:1.7}
@media (prefers-color-scheme:light){:root{--bg:#bfe8ff;--ink:#06283d;--accent:#c98a00}body{background-image:radial-gradient(circle at 50% 0%,#dff2ff 0,transparent 55%)}.sub,.hint{color:#0a5c8a}}
</style>
</head>
<body>
<h1>PIZZA BOAT RUN</h1>
<div class="sub">ST. JOHN · US VIRGIN ISLANDS</div>
<div id="wrap"><canvas id="g" width="360" height="560"></canvas></div>
<div class="hint">DRAG to steer your dinghy to Pizza Pi<br>Catch pizza &amp; turtles · dodge jellyfish, rocks &amp; mooring balls</div>
<script>
(function(){
const c=document.getElementById('g'),ctx=c.getContext('2d'),W=360,H=560;
let actx=null;
function beep(f,d,t,v){try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.type=t||'square';o.frequency.value=f;g.gain.value=v||.07;o.connect(g);g.connect(actx.destination);const s=actx.currentTime;o.start(s);g.gain.setValueAtTime(v||.07,s);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.stop(s+d)}catch(e){}}
const sC=()=>beep(880,.12),sB=()=>beep(1320,.2),sH=()=>beep(110,.3,'sawtooth'),sA=()=>{beep(660,.12);setTimeout(()=>beep(880,.12),120);setTimeout(()=>beep(1100,.2),240)};
let st='title',score=0,lives=3,level=1,dist=0,dm=100,bx=W/2,bv=0,tx=W/2,items=[],parts=[],clouds=[],sparks=[],stm=0,sg=50,fr=0,hi=0,bob=0;
function rnd(a,b){return a+Math.random()*(b-a)}
function lerp(a,b,t){return a+(b-a)*t}
function reset(){score=0;lives=3;level=1;dist=0;items=[];parts=[];stm=0;sg=50;bx=W/2;tx=W/2;bv=0}
for(let i=0;i<5;i++)clouds.push({x:rnd(0,W),y:rnd(20,90),s:rnd(.6,1.3),v:rnd(.1,.3)});
function spawn(){const r=Math.random();let t='pizza';if(r<.2)t='rock';else if(r<.3)t='jelly';else if(r<.36)t='moor';else if(r<.44)t='turtle';else if(r<.5)t='star';items.push({t,x:rnd(24,W-24),y:-20,d:.35,vy:rnd(1.4,2)+level*.2})}
function burst(px,py,col,n){for(let i=0;i<n;i++)parts.push({x:px,y:py,vx:rnd(-2.5,2.5),vy:rnd(-3,.5),l:rnd(20,40),m:40,col})}
function upd(){fr++;bob=Math.sin(fr*.06)*2;for(const cl of clouds){cl.x+=cl.v;if(cl.x>W+40)cl.x=-40}bx=lerp(bx,tx,.22);bv=lerp(bv,tx-bx,.2);bx=Math.max(26,Math.min(W-26,bx));if(st!=='playing')return;dist+=.35;if(dist>=dm){dist=0;level++;score+=100;sA();burst(W/2,H-60,'#ffd23f',30)}stm++;if(stm>=sg){stm=0;sg=Math.max(20,50-level*3);spawn()}for(let i=items.length-1;i>=0;i--){const it=items[i];it.y+=it.vy;it.d=Math.min(1,it.d+.012);const by=H-64,hf=14*it.d+8;if(it.y>by-10&&it.y<by+30&&Math.abs(it.x-bx)<hf+16){if(it.t==='pizza'){score+=10;sC();burst(it.x,it.y,'#f5c542',12)}else if(it.t==='turtle'){score+=30;sB();burst(it.x,it.y,'#3fae6a',14)}else if(it.t==='star'){score+=50;sB();burst(it.x,it.y,'#ff9d3f',16)}else{lives--;sH();burst(it.x,it.y,'#ff5e5b',18);if(lives<=0){st='over';hi=Math.max(hi,score)}}items.splice(i,1);continue}if(it.y>H+30)items.splice(i,1)}for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.12;p.l--;if(p.l<=0)parts.splice(i,1)}}
function sky(){const g=ctx.createLinearGradient(0,0,0,H*.42);g.addColorStop(0,'#2f8fd6');g.addColorStop(.6,'#7cc4ee');g.addColorStop(1,'#cdeffb');ctx.fillStyle=g;ctx.fillRect(0,0,W,H*.42);const sx=W*.78,sy=H*.16;const sg2=ctx.createRadialGradient(sx,sy,4,sx,sy,60);sg2.addColorStop(0,'rgba(255,244,180,.95)');sg2.addColorStop(.4,'rgba(255,220,120,.5)');sg2.addColorStop(1,'rgba(255,220,120,0)');ctx.fillStyle=sg2;ctx.fillRect(sx-60,sy-60,120,120);ctx.fillStyle='#fff3b0';ctx.beginPath();ctx.arc(sx,sy,16,0,7);ctx.fill();for(const cl of clouds){ctx.fillStyle='rgba(255,255,255,.85)';ctx.beginPath();ctx.ellipse(cl.x,cl.y,22*cl.s,9*cl.s,0,0,7);ctx.ellipse(cl.x+16*cl.s,cl.y+3*cl.s,16*cl.s,7*cl.s,0,0,7);ctx.ellipse(cl.x-16*cl.s,cl.y+3*cl.s,14*cl.s,6*cl.s,0,0,7);ctx.fill()}}
function isl(){ctx.fillStyle='#2a7a5a';ctx.beginPath();ctx.moveTo(0,H*.42);ctx.quadraticCurveTo(W*.18,H*.3,W*.34,H*.42);ctx.quadraticCurveTo(W*.5,H*.34,W*.66,H*.42);ctx.quadraticCurveTo(W*.85,H*.28,W,H*.42);ctx.lineTo(W,H*.42);ctx.closePath();ctx.fill();ctx.fillStyle='#1f6a4a';ctx.beginPath();ctx.moveTo(0,H*.42);ctx.quadraticCurveTo(W*.12,H*.36,W*.24,H*.42);ctx.lineTo(0,H*.42);ctx.closePath();ctx.fill();ctx.strokeStyle='#5a3a1a';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(W*.1,H*.4);ctx.quadraticCurveTo(W*.12,H*.3,W*.16,H*.28);ctx.stroke();ctx.fillStyle='#2f8f5a';for(let a=0;a<5;a++){const an=-.6+a*.5;ctx.beginPath();ctx.ellipse(W*.16+Math.cos(an)*14,H*.28+Math.sin(an)*6,12,4,an,0,7);ctx.fill()}}
function water(){const g=ctx.createLinearGradient(0,H*.42,0,H);g.addColorStop(0,'#0e6f9e');g.addColorStop(.5,'#1aa3a0');g.addColorStop(1,'#3fd6c0');ctx.fillStyle=g;ctx.fillRect(0,H*.42,W,H-H*.42);for(let i=0;i<7;i++){const t=i/7,y=H*.44+t*t*H*.5+Math.sin(fr*.05+i)*2;ctx.fillStyle='rgba(255,255,255,'+(.1+t*.12).toFixed(2)+')';ctx.fillRect(0,y,W,1+t*2.5)}if(fr%6===0)sparks.push({x:rnd(0,W),y:rnd(H*.45,H),l:30});for(let i=sparks.length-1;i>=0;i--){const s=sparks[i];s.l--;ctx.fillStyle='rgba(255,255,255,'+(s.l/30*.7).toFixed(2)+')';ctx.fillRect(s.x,s.y,2,2);if(s.l<=0)sparks.splice(i,1)}}
function pizza(px,py,s){ctx.save();ctx.translate(px,py);ctx.scale(s,s);ctx.fillStyle='#e8a33d';ctx.beginPath();ctx.arc(0,0,16,0,7);ctx.fill();ctx.fillStyle='#f5c542';ctx.beginPath();ctx.arc(0,0,13,0,7);ctx.fill();ctx.fillStyle='#e05a3a';ctx.beginPath();ctx.arc(0,0,9,0,7);ctx.fill();ctx.fillStyle='#c0392b';[[-5,-3],[4,-5],[0,5]].forEach(p=>{ctx.beginPath();ctx.arc(p[0],p[1],2.5,0,7);ctx.fill()});ctx.restore()}
function turtle(px,py,s){ctx.save();ctx.translate(px,py);ctx.scale(s,s);ctx.fillStyle='#2f8f5a';ctx.beginPath();ctx.ellipse(-14,0,8,4,-.4,0,7);ctx.fill();ctx.beginPath();ctx.ellipse(14,0,8,4,.4,0,7);ctx.fill();ctx.fillStyle='#3fae6a';ctx.beginPath();ctx.ellipse(0,0,13,10,0,0,7);ctx.fill();ctx.fillStyle='#2f8f5a';ctx.beginPath();ctx.ellipse(0,0,9,6,0,0,7);ctx.fill();ctx.fillStyle='#7fd4a0';ctx.beginPath();ctx.arc(0,-12,5,0,7);ctx.fill();ctx.restore()}
function star(px,py,s){ctx.save();ctx.translate(px,py);ctx.scale(s,s);ctx.rotate(fr*.02);ctx.fillStyle='#ff9d3f';ctx.beginPath();for(let i=0;i<5;i++){const a=-Math.PI/2+i*2*Math.PI/5,a2=a+Math.PI/5;ctx.lineTo(Math.cos(a)*14,Math.sin(a)*14);ctx.lineTo(Math.cos(a2)*6,Math.sin(a2)*6)}ctx.closePath();ctx.fill();ctx.fillStyle='#ffc37a';ctx.beginPath();ctx.arc(0,0,3,0,7);ctx.fill();ctx.restore()}
function jelly(px,py,s){ctx.save();ctx.translate(px,py);ctx.scale(s,s);const p=1+Math.sin(fr*.1)*.08;ctx.fillStyle='rgba(255,150,200,.75)';ctx.beginPath();ctx.arc(0,0,13*p,Math.PI,0);ctx.closePath();ctx.fill();ctx.fillStyle='rgba(255,120,180,.6)';for(let i=-2;i<=2;i++){ctx.beginPath();ctx.moveTo(i*5,2);ctx.quadraticCurveTo(i*5+Math.sin(fr*.1+i)*3,14,i*5,22);ctx.lineTo(i*5+3,22);ctx.quadraticCurveTo(i*5+3,14,i*5+3,2);ctx.fill()}ctx.restore()}
function rock(px,py,s){ctx.save();ctx.translate(px,py);ctx.scale(s,s);ctx.fillStyle='#5a6472';ctx.beginPath();ctx.moveTo(-14,6);ctx.lineTo(-8,-8);ctx.lineTo(2,-12);ctx.lineTo(12,-4);ctx.lineTo(14,6);ctx.closePath();ctx.fill();ctx.fillStyle='#7a8494';ctx.beginPath();ctx.moveTo(-8,-8);ctx.lineTo(2,-12);ctx.lineTo(6,-2);ctx.lineTo(-4,0);ctx.closePath();ctx.fill();ctx.restore()}
function moor(px,py,s){ctx.save();ctx.translate(px,py);ctx.scale(s,s);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,0,11,0,7);ctx.fill();ctx.fillStyle='#ff5e3a';ctx.beginPath();ctx.arc(0,0,11,0,Math.PI);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,0,4,0,7);ctx.fill();ctx.restore()}
function boat(){const y=H-64+bob,tilt=Math.max(-.18,Math.min(.18,bv*.02));ctx.save();ctx.translate(bx,y);ctx.rotate(tilt);ctx.fillStyle='rgba(255,255,255,.5)';ctx.beginPath();ctx.moveTo(-16,14);ctx.lineTo(-26,30);ctx.lineTo(-10,30);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(16,14);ctx.lineTo(26,30);ctx.lineTo(10,30);ctx.closePath();ctx.fill();const hg=ctx.createLinearGradient(0,-14,0,16);hg.addColorStop(0,'#e8b06a');hg.addColorStop(1,'#8a4b2a');ctx.fillStyle=hg;ctx.beginPath();ctx.moveTo(-24,2);ctx.quadraticCurveTo(0,18,24,2);ctx.lineTo(18,-6);ctx.lineTo(-18,-6);ctx.closePath();ctx.fill();ctx.fillStyle='#f2e6c9';ctx.fillRect(-16,-10,32,6);ctx.fillStyle='#fff';ctx.fillRect(-8,-16,16,8);ctx.fillStyle='#e05a3a';ctx.fillRect(-6,-14,12,4);ctx.fillStyle='#ffd23f';ctx.beginPath();ctx.arc(0,-20,5,0,7);ctx.fill();ctx.fillStyle='#2f6fd6';ctx.fillRect(-5,-16,10,8);ctx.strokeStyle='#5a3a1a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(20,-6);ctx.lineTo(20,-20);ctx.stroke();ctx.fillStyle='#ff5e5b';ctx.fillRect(20,-20,8,5);ctx.restore()}
function hud(){ctx.font='8px "Press Start 2P"';ctx.textBaseline='top';ctx.textAlign='left';ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(0,0,W,40);ctx.fillStyle='#fff';ctx.fillText('SCORE '+score,8,8);ctx.fillText('LV '+level,8,20);for(let i=0;i<lives;i++){ctx.fillStyle='#ff5e5b';ctx.fillRect(8+i*14,32,10,6)}if(hi>0){ctx.fillStyle='#ffd23f';ctx.fillText('HI '+hi,W-8-ctx.measureText('HI '+hi).width,8)}ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(W-70,20,62,8);ctx.fillStyle='#3fd6c0';ctx.fillRect(W-68,22,58*(dist/dm),4)}
function title(){sky();isl();water();const cx=W/2,cy=170;ctx.save();ctx.translate(cx,cy);ctx.fillStyle='#e8a33d';ctx.beginPath();ctx.arc(0,0,60,0,7);ctx.fill();ctx.fillStyle='#f5c542';ctx.beginPath();ctx.arc(0,0,50,0,7);ctx.fill();ctx.fillStyle='#e05a3a';ctx.beginPath();ctx.arc(0,0,36,0,7);ctx.fill();ctx.fillStyle='#c0392b';[[-18,-12],[15,-18],[0,18],[-20,16],[18,14]].forEach(p=>{ctx.beginPath();ctx.arc(p[0],p[1],7,0,7);ctx.fill()});ctx.restore();ctx.font='18px "Press Start 2P"';ctx.textAlign='center';ctx.fillStyle='#ffd23f';ctx.fillText('PIZZA BOAT',cx,260);ctx.font='8px "Press Start 2P"';ctx.fillStyle='#7fd4c8';ctx.fillText('RUN TO PIZZA PI',cx,280);if(Math.floor(fr/30)%2===0){ctx.fillStyle='#fff';ctx.fillText('TAP OR PRESS SPACE',cx,330)}ctx.fillStyle='#7fd4c8';ctx.fillText('CATCH PIZZA · DODGE THE REEF',cx,356);ctx.textAlign='left'}
function over(){ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,W,H);ctx.font='16px "Press Start 2P"';ctx.textAlign='center';ctx.fillStyle='#ff5e5b';ctx.fillText('GAME OVER',W/2,200);ctx.font='10px "Press Start 2P"';ctx.fillStyle='#fff';ctx.fillText('SCORE '+score,W/2,240);if(score>=hi&&hi>0){ctx.fillStyle='#ffd23f';ctx.fillText('NEW BEST!',W/2,264)}if(Math.floor(fr/30)%2===0){ctx.fillStyle='#fff';ctx.fillText('TAP TO RETRY',W/2,320)}ctx.textAlign='left'}
function loop(){upd();ctx.clearRect(0,0,W,H);if(st==='title')title();else{sky();isl();water();for(const it of items){if(it.t==='pizza')pizza(it.x,it.y,it.d);else if(it.t==='turtle')turtle(it.x,it.y,it.d);else if(it.t==='star')star(it.x,it.y,it.d);else if(it.t==='jelly')jelly(it.x,it.y,it.d);else if(it.t==='rock')rock(it.x,it.y,it.d);else moor(it.x,it.y,it.d)}for(const p of parts){ctx.globalAlpha=p.l/p.m;ctx.fillStyle=p.col;ctx.fillRect(p.x-2,p.y-2,4,4);ctx.globalAlpha=1}boat();hud();if(st==='over')over()}requestAnimationFrame(loop)}
function setBx(px){const r=c.getBoundingClientRect(),sc=W/r.width;tx=Math.max(26,Math.min(W-26,(px-r.left)*sc))}
function start(){if(st==='title'||st==='over'){reset();st='playing';sA()}}
window.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();start()}if(st!=='playing')return;if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')tx=Math.max(26,tx-16);if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')tx=Math.min(W-26,tx+16)});
c.addEventListener('pointerdown',e=>{e.preventDefault();if(st!=='playing'){start();return}setBx(e.clientX)});
c.addEventListener('pointermove',e=>{if(st==='playing'&&e.buttons>0)setBx(e.clientX)});
loop();
})();
</script>
</body>
</html>
